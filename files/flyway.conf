# PLACEHOLDER: this is a per-application DB connection, not a shared
# endpoint like Nexus -- url/user need real per-project edits after the MR
# lands, they can't be filled in centrally the way the other bundled files
# can. The password is deliberately left OUT of this file: flyway.conf is
# plain Java properties syntax, it does not expand ${VAR} the way
# settings.xml/nuget.config/.npmrc do -- set it as the FLYWAY_PASSWORD
# masked CI/CD variable instead, which Flyway reads natively (any
# flyway.conf key can be overridden by an env var named FLYWAY_<KEY>).
#
# Flyway also does NOT auto-discover a project-root flyway.conf by default
# (it looks in <flyway-install-dir>/conf/flyway.conf) -- the remote
# pipeline template's script must point at it explicitly, e.g.:
#   flyway -configFiles="$CI_PROJECT_DIR/flyway.conf" migrate
# Confirm that's actually done in
# dso-templates/ci-cd-components/pipeline-templates' flyway-cd.gitlab.yml.
