# PLACEHOLDER: real private PyPI mirror URL goes here.
#
# Two things this file alone does NOT do, unlike .npmrc/nuget.config:
#  1. pip does not auto-discover a project-root pip.conf -- the remote
#     pipeline template's script must point pip at it explicitly, e.g.:
#       export PIP_CONFIG_FILE="$CI_PROJECT_DIR/pip.conf"
#     before any `pip install`. Confirm that's actually done in
#     dso-templates/ci-cd-components/pipeline-templates' python-*.gitlab.yml.
#  2. pip.conf is a plain INI file -- pip does NOT expand ${VAR} inside it,
#     so credentials can't be templated here the way settings.xml/nuget.config
#     do. The simpler, more standard route for credentials specifically is to
#     skip this file for auth and instead set PIP_INDEX_URL as a masked
#     CI/CD variable (pip reads it natively, with the user:pass embedded in
#     the URL) -- worth confirming that's the intended approach before
#     relying on this file for anything beyond the mirror URL itself.
[global]
index-url = https://TODO/simple/
