stages:
  - plan
  - apply

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PROJECT_ID:
    description: "Target project: numeric ID or path_with_namespace."
    value: ""
  TEMPLATE_NAME:
    description: "CI/CD template to add. Run the 'suggest' job first if unsure -- check its log for a hint before picking here."
    value: "ansible-cd"
    options:
      - "ansible-cd"
      - "dotnet-ansible-ci-cd"
      - "dotnet-core-ansible-ci-cd"
      - "dotnet-core-iis-ci-cd"
      - "dotnet-core-openshift-helm-ci-cd"
      - "dotnet-framework-iis-ci-cd"
      - "flyway-cd"
      - "java-ant-fileDeploy-ci-cd"
      - "java-ant-tomcat-ci-cd"
      - "java-gradle-ci"
      - "java-gradle-fileDeploy-ci-cd"
      - "java-gradle-openshift-ci-cd"
      - "java-gradle-openshift-helm-ci-cd"
      - "java-lambda-ci-cd"
      - "java-maven-ansible-ci-cd"
      - "java-maven-ci"
      - "java-maven-ecs-ci-cd"
      - "java-maven-openshift-ci-cd"
      - "java-maven-openshift-helm-ci-cd"
      - "node-ci"
      - "node-ecs-ci-cd"
      - "node-lambda-ci-cd"
      - "node-openshift-ci-cd"
      - "node-openshift-helm-ci-cd"
      - "python-ansible-ci-cd"
      - "python-ci"
      - "python-lambda-ci-cd"
      - "python-openshift-ci-cd"
      - "ssis-ci-cd"
      - "terraform-cd"
      - "terraform-cli-cd"
      - "terraform-kafka-cd"
  TEMPLATES_FILE:
    value: "configs/templates.yaml"

plan:
  stage: plan
  script:
    - ./bin/gitlab-ci-bootstrap-linux-amd64 plan --project="$PROJECT_ID" --template="$TEMPLATE_NAME" --templates="$TEMPLATES_FILE" --out=plan.json
  artifacts:
    paths: [plan.json]
    expire_in: 1 week

apply:
  stage: apply
  when: manual
  needs: ["plan"]
  script:
    - ./bin/gitlab-ci-bootstrap-linux-amd64 apply --plan=plan.json --templates="$TEMPLATES_FILE" --out=result.json
  artifacts:
    when: always
    paths: [result.json]
    expire_in: 1 month
