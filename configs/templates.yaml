  # --- .NET (IIS is the default target; core vs framework by .csproj content) ---
  - name: dotnet-core-iis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-core-iis-ci-cd.gitlab.yml
        extra_variables:
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
    detect: ["*.csproj"]
    detect_content_contains: "Sdk="
    # No .bumpversion.cfg here -- this template's bumpVersion() does a raw
    # sed on the .csproj's <version> tag directly, no bumpversion tool.
    # The .csproj still needs a custom <ApplicationName> tag (same as
    # dotnet-framework-iis-ci-cd) plus a lowercase <version> tag (NOT
    # <Version> like the Framework template uses).
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_NUGET_DEV_REPO
      - ARTIFACTORY_NUGET_PROD_REPO
      per_project:
      - BUILD_TARGET
      - WEB_PROJECT
      - BuildConfiguration
      - BuildPlatform
      - ARTIFACT_STAGING
      - ARTIFACT_NAME
      - version_file
      - DEVELOPMENT_DEPLOY_WHEN
      - TESTING_DEPLOY_WHEN
      - STAGING_DEPLOY_WHEN
      - STAGING_DR_DEPLOY_WHEN
      - PERFORMANCE_DEPLOY_WHEN
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - IIS_SITE
        - IIS_APPPOOL
        - DEPLOY_PATH
        - BACKUP_ROOT
      notes:
      - "`ARTIFACT_NAME` must exactly match the `<ApplicationName>` tag in the .csproj -- `package:download` names the file after `<ApplicationName>`, and the IIS deploy jobs look for `ARTIFACT_NAME` when finding it locally. A mismatch means deploy can't find the artifact."
      - "`version_file` defaults to a stale example path (`ReferralEngine.API/ReferralEngine.API.csproj`) in the shared template, not blank -- `dotnetPreRelease()` only falls back to auto-discovering the `.csproj` file when `version_file` is empty, so leaving the default as-is points the build at a `.csproj` that doesn't exist in this project. Set it to this app's actual `.csproj` path (or blank, to use auto-discovery)."
      - "Set `DEVELOPMENT_DEPLOY_WHEN`, `TESTING_DEPLOY_WHEN`, `STAGING_DEPLOY_WHEN`, `STAGING_DR_DEPLOY_WHEN`, and `PERFORMANCE_DEPLOY_WHEN` to `on_success` as project variables -- that is the default; for an environment whose deploy should behave differently, use `on_failure`, `always`, `manual`, or `never` instead."
  - name: dotnet-framework-iis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-framework-iis-ci-cd.gitlab.yml
        extra_variables:
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
      - target_path: .bumpversion.cfg
        source_path: files/bumpversion.cfg
        source: local
    detect: ["*.csproj"]
    detect_content_contains: "<TargetFrameworkVersion>"
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_NUGET_DEV_REPO
      - ARTIFACTORY_NUGET_PROD_REPO
      - VSTEST_PATH
      per_project:
      - SolutionName
      - BuildConfiguration
      - BuildPlatform
      - ARTIFACT_PUBLISH_PATH
      - GITLAB_PUBLISH
      - IS_MSDEPLOY
      - TestAssemblyFilter
      - DEVELOPMENT_DEPLOY_WHEN
      - TESTING_DEPLOY_WHEN
      - STAGING_DEPLOY_WHEN
      - STAGING_DR_DEPLOY_WHEN
      - PERFORMANCE_DEPLOY_WHEN
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - IIS_SITE
        - IIS_APPPOOL
        - DEPLOY_PATH
        - PACKAGE_FOLDER
        - BACKUP_ROOT
      notes:
      - "`package:test`'s script reads `TestAssemblyFilter` and `VSTEST_PATH`, neither of which the shared template defines anywhere -- without them `Get-ChildItem -Filter $env:TestAssemblyFilter` matches nothing and the `vstest.console.exe` invocation has nothing to run, so the job silently produces no test results (it won't fail the pipeline itself since `package:test` is `allow_failure: true`). `TestAssemblyFilter` is per-app (e.g. `*.Tests.dll`); `VSTEST_PATH` looks like a fixed path on the shared Windows runner pool, so confirm it already exists at group level rather than assuming -- we don't have independent confirmation of that the way we do for `ARTIFACTORY_URL` elsewhere."
      - "Fill in the `<path to .csproj file>` placeholder in `.bumpversion.cfg` with this app's real .csproj path before merging, or `pre:config`/`bump:version` will fail."
      - "Set `DEVELOPMENT_DEPLOY_WHEN`, `TESTING_DEPLOY_WHEN`, `STAGING_DEPLOY_WHEN`, `STAGING_DR_DEPLOY_WHEN`, and `PERFORMANCE_DEPLOY_WHEN` to `on_success` as project variables -- that is the default; for an environment whose deploy should behave differently, use `on_failure`, `always`, `manual`, or `never` instead."
  - name: dotnet-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-ansible-ci-cd.gitlab.yml
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
