# Every CI/CD template gitlab-ci-bootstrap can offer, picked by a human via
# the pipeline's TEMPLATE_NAME dropdown (kept in sync manually with
# .gitlab-ci.yml's `options:` list). Each template's `files` list is the
# whole bundle it adds -- e.g. a Maven template carries both .gitlab-ci.yml
# and .m2/settings.xml; picking the template adds all of them in one
# commit/MR, there's no separate per-file choice.
#
# Each file's `source_path` is fetched from `remote_source` below UNLESS the
# file sets `source: local`, in which case it's read from THIS repo instead
# (see files/) -- for bundle files this tool owns, like settings.xml with
# Artifactory credentials, that have no reason to live in the shared
# templates project. The main .gitlab-ci.yml for every template is remote;
# its source_path already matches that project's file naming 1:1 (its
# `templates/` folder).
#
# `detect`/`detect_content_contains` are informational only, consumed by the
# `suggest` command to hint at a likely pick -- they never decide what
# `plan`/`apply` do. Ported from the batch reconciler's old auto-detection
# as a starting point; only the build-tool/language tier is reliably
# detectable (10 of 29 templates), the rest are override-free here too since
# there's no override concept anymore -- a human always makes the final
# call via the dropdown.

remote_source:
  project_path: "dso-templates/ci-cd-components/pipeline-templates"
  ref: master

templates:
  # --- Java: Maven ---
  - name: java-maven-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ci.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
    detect: ["pom.xml"]
    mr_checklist:
      notes:
      - "Make sure `pom.xml` declares `<version>`, `<groupId>`, and `<artifactId>` -- `package:build`'s validation hard-fails (MAV007/MAV008/MAV014) if any is missing."
      - "Wire up the jacoco-maven-plugin in `pom.xml` to produce `target/site/jacoco/index.html` -- `package:test` hard-fails (MAV004) without it, unless this app's packaging type is `pom` with no `.java` sources."
      - "If this app's `pom.xml` uses a property-based version (e.g. `<version>${revision}</version>`) rather than a literal value, set `version_property` to that property name -- otherwise `bump:version`'s raw `sed` against the literal `<version>` tag won't find a match and silently fails to bump anything."
  - name: java-maven-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ansible-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
    mr_checklist:
      per_project:
      - ANSIBLE_PROJECT_SCM_URL
      - DEV_ANS_PROJECT_NAME
      - DEV_ANS_TEMPLATE_NAME
      - DEV_ANS_JOB_INVENTORY
      - DEV_ENV
      - QA_ANS_PROJECT_NAME
      - QA_ANS_TEMPLATE_NAME
      - QA_ANS_JOB_INVENTORY
      - QA_ENV
      - UAT_ANS_PROJECT_NAME
      - UAT_ANS_TEMPLATE_NAME
      - UAT_ANS_JOB_INVENTORY
      - UAT_ENV
      - DR_ANS_PROJECT_NAME
      - DR_ANS_TEMPLATE_NAME
      - DR_ANS_JOB_INVENTORY
      - DR_ENV
      - PERF_ANS_PROJECT_NAME
      - PERF_ANS_TEMPLATE_NAME
      - PERF_ANS_JOB_INVENTORY
      - PERF_ENV
      - PROD_ANS_PROJECT_NAME
      - PROD_ANS_TEMPLATE_NAME
      - PROD_ANS_JOB_INVENTORY
      - PROD_ENV
      - PROD_DR_ANS_PROJECT_NAME
      - PROD_DR_ANS_TEMPLATE_NAME
      - PROD_DR_ANS_JOB_INVENTORY
      - PROD_DR_ENV
      notes:
      - "Make sure `pom.xml` declares `<version>`, `<groupId>`, and `<artifactId>` -- `package:build`'s validation hard-fails (MAV007/MAV008/MAV014) if any is missing."
      - "Wire up the jacoco-maven-plugin in `pom.xml` to produce `target/site/jacoco/index.html` -- `package:test` hard-fails (MAV004) without it, unless this app's packaging type is `pom` with no `.java` sources."
      - "If this app's `pom.xml` uses a property-based version (e.g. `<version>${revision}</version>`) rather than a literal value, set `version_property` to that property name -- otherwise `bump:version`'s raw `sed` against the literal `<version>` tag won't find a match and silently fails to bump anything."
  - name: java-maven-ecs-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ecs-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
  - name: java-maven-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-openshift-ci-cd.gitlab.yml
        extra_variables:
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
        - name: JAVA_SDK_VERSION
          value: java17
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_SNAPSHOT_REPO
      - ARTIFACTORY_RELEASE_REPO
      - ARTIFACTORY_MVN_SNAPSHOT_REPO
      - ARTIFACTORY_MVN_RELEASE_REPO
      per_project:
      - CYBERARK_APP_NAME
      - APP_ID
      - OSE_INSTANCE
      - CYBERARK_DEV_APP_ID
      - CYBERARK_DEV_SAFE_ID
      - CYBERARK_QA_APP_ID
      - CYBERARK_QA_SAFE_ID
      - CYBERARK_UAT_APP_ID
      - CYBERARK_UAT_SAFE_ID
      - CYBERARK_DR_APP_ID
      - CYBERARK_DR_SAFE_ID
      - CYBERARK_PERF_APP_ID
      - CYBERARK_PERF_SAFE_ID
      - CYBERARK_PROD_APP_ID
      - CYBERARK_PROD_SAFE_ID
      - CYBERARK_PROD_DR_APP_ID
      - CYBERARK_PROD_DR_SAFE_ID
      - OSE_DEV_USERNAME
      - OSE_DEV_PASSWORD
      - OSE_QA_USERNAME
      - OSE_QA_PASSWORD
      - OSE_UAT_USERNAME
      - OSE_UAT_PASSWORD
      - OSE_UAT_DRUSERNAME
      - OSE_UAT_DRPASSWORD
      - OSE_PERF_USERNAME
      - OSE_PERF_PASSWORD
      - OSE_PROD_USERNAME
      - OSE_PROD_PASSWORD
      - OSE_PROD_DRUSERNAME
      - OSE_PROD_DRPASSWORD
      - OSE_PERF_HOST_URL
      - OSE_UAT_DRHOST_URL
      - OSE_PROD_DRHOST_URL
      - OSE_DEV_PROJECT
      - OSE_QA_PROJECT
      - OSE_UAT_PROJECT
      - OSE_DR_PROJECT
      - OSE_PERF_PROJECT
      - OSE_PROD_PROJECT
      - OSE_PROD_DR_PROJECT
      notes:
      - "Make sure `pom.xml` declares `<version>`, `<groupId>`, and `<artifactId>` -- `package:build`'s validation hard-fails (MAV007/MAV008/MAV014) if any is missing."
      - "Wire up the jacoco-maven-plugin in `pom.xml` to produce `target/site/jacoco/index.html` -- `package:test` hard-fails (MAV004) without it, unless this app's packaging type is `pom` with no `.java` sources."
      - "If this app's `pom.xml` uses a property-based version (e.g. `<version>${revision}</version>`) rather than a literal value, set `version_property` to that property name -- otherwise `bump:version`'s raw `sed` against the literal `<version>` tag won't find a match and silently fails to bump anything."
      - "Add a deploy `*.yml` manifest and either `application.properties` or `application.yml` under `k8s/<environment>/` in this repo for every environment you deploy to (development, testing, staging, staging-dr, performance, production, production-dr) -- the shared template hard-fails (OPE002/OPE003) without them."
      - "If this app doesn't use CyberArk, set `CYBERARK_ENABLED` to `0` as a project variable to skip the CyberArk app/safe ID requirements above (it defaults to `1`/enabled)."
      - "Set `APPDYNAMICS_ENABLED` to `YES` as a project variable only if this app uses AppDynamics -- it defaults to `NO` and the deploy job skips the AppDynamics CyberArk lookup when off."
      - "Override `OSE_PROJECT_NAME`'s default (currently `gen-ui-dev`, a leftover example from another app) with this app's own OpenShift namespace if you ever trigger a manual pipeline run outside the standard branch/tag rules -- the per-environment `OSE_*_PROJECT` variables above already cover the normal deploy jobs."
  - name: java-maven-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-openshift-helm-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local

  # --- Java: Gradle ---
  - name: java-gradle-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-ci.gitlab.yml
    detect: ["build.gradle", "build.gradle.kts"]
  - name: java-gradle-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-openshift-ci-cd.gitlab.yml
  - name: java-gradle-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-openshift-helm-ci-cd.gitlab.yml
  - name: java-gradle-fileDeploy-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-fileDeploy-ci-cd.gitlab.yml
        extra_variables:
        - name: GITLAB_PUBLISH
          value: ""
          description: 'Please select true if publishing to gitlab '
          options:
          - "true"
          - "false"
          - ""
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_MAVEN_DEV_REPO
      - ARTIFACTORY_MAVEN_PROD_REPO
      per_project:
      - IS_GRADLEW
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - DEPLOY_PATH
        - PACKAGE_FOLDER
      notes:
      - "`IS_GRADLEW` has no default anywhere in the shared template, but it's the single biggest behavior switch in the pipeline -- it decides whether `package:build`/`package:publish`/the release-publish job run this app's own `./gradlew` wrapper, or fall back to the runner's system `gradle` binary plus a legacy `mvn deploy:deploy-file` publish path. Every project must set it explicitly to `true` (repo has `./gradlew` checked in) or `false`."
      - "`is_multi_file` defaults to `'yes'` in the shared template, so `package:build` tars up `MULTI_FILE_SOURCE_DIR` (defaults to `dist`) by default -- `dist` isn't a standard Gradle output directory, so confirm/override it per app to match wherever this project's build actually stages its deployable files, or the archive job will fail or package the wrong thing."
      - "`PUBLISH_ARTIFACTS` defaults to `'No'` in the shared template, so `package:publish` is a silent no-op (nothing gets pushed to Artifactory or GitLab's package registry) until it's explicitly set to `'Yes'` -- confirm this default is intentional per project."
      - "`PACKAGE_FOLDER` is only actually required when `BACKUP_ENABLED` is `true` (the deploy script's own validation is conditional on it) -- still worth setting per environment so backups work if it's ever turned on."
      - "`ARTIFACTORY_MAVEN_DEV_REPO`/`ARTIFACTORY_MAVEN_PROD_REPO` must be configured directly -- unlike every other language family in this shared template, nothing in this template's workflow rules wires them up automatically per branch."

  # --- Java: Ant / Tomcat ---
  - name: java-ant-tomcat-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-ant-tomcat-ci-cd.gitlab.yml
        extra_variables:
        - name: GITLAB_PUBLISH
          value: ""
          description: 'Please select true if publishing to gitlab '
          options:
          - "true"
          - "false"
          - ""
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: .bumpversion.cfg
        source_path: files/bumpversion-ant-properties.cfg
        source: local
    detect: ["build.xml"]
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_MAVEN_DEV_REPO
      - ARTIFACTORY_MAVEN_PROD_REPO
      per_project:
      - PROPERTY_FILE
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
      notes:
      - "`PROPERTY_FILE` should point at this app's properties file containing `name=`/`version=` (read by `antPreRelease()`); its `name=` value becomes `artifactId` everywhere downstream (package naming, WAR lookup, deploy) -- the same role `<ApplicationName>` plays for the .NET IIS templates."
      - "The `.bumpversion.cfg`'s `[bumpversion:file:app.properties]` section assumes the properties file is at `app.properties` in the repo root -- if `PROPERTY_FILE` points elsewhere, update this section's file path to match, or `bump:version` will silently bump the wrong file (or none)."
      - "`SERVICE_NAME`, `DEPLOY_DIR`, and `BACKUP_ROOT` already have defaults in the shared template (`Tomcat9`, `D:\\apache-tomcat\\apache-tomcat-current\\webapps`, `D:\\DEV`) as pipeline-run variables, not CI/CD Settings variables -- if this project needs different values, add a `variables:` block directly to this generated `.gitlab-ci.yml` to override them, rather than setting them in Settings > CI/CD > Variables."

  - name: java-ant-fileDeploy-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-ant-fileDeploy-ci-cd.gitlab.yml
        extra_variables:
        - name: GITLAB_PUBLISH
          value: "true"
          description: 'Please select true if publishing to gitlab '
          options:
          - "true"
          - "false"
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
        - name: JAVA_SDK_VERSION
          value: java17
        - name: PROPERTY_FILE
          value: app.properties
        - name: MULTI_FILE_SOURCE_DIR
          value: dist
        - name: BACKUP_ENABLED
          value: "false"
          options:
          - "true"
          - "false"
      - target_path: .bumpversion.cfg
        source_path: files/bumpversion-ant-properties.cfg
        source: local
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_MAVEN_DEV_REPO
      - ARTIFACTORY_MAVEN_PROD_REPO
      - ANT_CONTAINER_REGISTRY_PATH
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - DEPLOY_PATH
        - PACKAGE_FOLDER
      notes:
      - "`PACKAGE_FOLDER` is only actually required when `BACKUP_ENABLED` is `true` (the deploy script's own validation is conditional on it) -- still worth setting per environment so backups work if it's ever turned on."
      - "`PROPERTY_FILE` already defaults to `app.properties` directly in the shared template (unlike `java-ant-tomcat-ci-cd`, where it had no default) -- only override it if this app's properties file lives somewhere else, and update `.bumpversion.cfg`'s `[bumpversion:file:app.properties]` path to match."

  # --- Java: Lambda ---
  - name: java-lambda-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-lambda-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local

  # --- Node ---
  - name: node-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-ci.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
    detect: ["package.json"]
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_NODE_DEV_REPO
      - ARTIFACTORY_NODE_PROD_REPO
      - ARTIFACTORY_NODE_VIRTUAL_REPO
      notes:
      - "If this is an Angular app (`is_angular_build` set to `true`), also set `ARTIFACTORY_GENERIC_REPO` as a project variable -- the publish job's alternate Angular path needs it and it has no default."
  - name: node-ecs-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-ecs-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
  - name: node-iis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-iis-ci-cd.gitlab.yml
        extra_variables:
          - name: DEPLOY_VARIABLE
            value: development
            description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
            options:
              - development
              - testing
              - staging
              - staging-dr
              - performance
              - production
              - production-dr
          - name: CREATE_RELEASE
            value: "No"
            description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
            options:
              - "Yes"
              - "No"
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
    mr_checklist:
      group_level:
        - ARTIFACTORY_USER
        - ARTIFACTORY_PASSWORD
        - ARTIFACTORY_NODE_DEV_REPO
        - ARTIFACTORY_NODE_PROD_REPO
        - ARTIFACTORY_NODE_VIRTUAL_REPO
      per_project:
        - DEVELOPMENT_DEPLOY_WHEN
        - TESTING_DEPLOY_WHEN
        - STAGING_DEPLOY_WHEN
        - STAGING_DR_DEPLOY_WHEN
        - PERFORMANCE_DEPLOY_WHEN
      per_environment:
        environments: [ development, testing, staging, staging-dr, performance, production, production-dr ]
        variables:
          - TARGET_HOST
          - WINRM_USER
          - WINRM_PASSWORD
          - IIS_SITE
          - IIS_APPPOOL
          - DEPLOY_PATH
          - BACKUP_ROOT
      notes:
        - "Set `IIS_APPPOOL`, `DEPLOY_PATH`, and `BACKUP_ROOT` for every environment -- the shared template's defaults are leftovers from another app (`ConfigManagementAPIPool`, `D:\\Inetpub\\WWWRoot\\ConfigManager-Api`, `D:\\backup\\inetpub\\wwwroot\\ConfigManager-Api`), and `IIS_SITE` defaults to `Default Web Site`."
        - "Set `DEPLOY_PATH` to exactly the IIS site's physical path -- the deploy job's validation step compares the two and throws before deploying anything if they differ."
        - "Set `is_angular_build` to `false` if this is not an Angular app -- the shared template defaults it to `true`, which makes the build run `ng build` from `src/` and the publish job package `dist/`. For an Angular app, keep the sources under `src/` and set `ANGULAR_CLI_VERSION` to the version this app uses (default `11`)."
        - "Set `DEVELOPMENT_DEPLOY_WHEN`, `TESTING_DEPLOY_WHEN`, `STAGING_DEPLOY_WHEN`, `STAGING_DR_DEPLOY_WHEN`, and `PERFORMANCE_DEPLOY_WHEN` to `on_success` as project variables -- that is the default; for an environment whose deploy should behave differently, use `on_failure`, `always`, `manual`, or `never` instead."
  - name: node-lambda-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-lambda-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
