      - CYBERARK_DEV_SAFE_ID
      - CYBERARK_QA_APP_ID
      - CYBERARK_QA_SAFE_ID
      - CYBERARK_UAT_APP_ID
      - CYBERARK_UAT_SAFE_ID
      - CYBERARK_DR_APP_ID
      - CYBERARK_DR_SAFE_ID
      - CYBERARK_PERF_APP_ID
      - CYBERARK_PERF_SAFE_ID
      - CYBERARK_PROD_APP_ID
      - CYBERARK_PROD_SAFE_ID
      - CYBERARK_PROD_DR_APP_ID
      - CYBERARK_PROD_DR_SAFE_ID
      - OSE_DEV_USERNAME
      - OSE_DEV_PASSWORD
      - OSE_QA_USERNAME
      - OSE_QA_PASSWORD
      - OSE_UAT_USERNAME
      - OSE_UAT_PASSWORD
      - OSE_UAT_DRUSERNAME
      - OSE_UAT_DRPASSWORD
      - OSE_PERF_USERNAME
      - OSE_PERF_PASSWORD
      - OSE_PROD_USERNAME
      - OSE_PROD_PASSWORD
      - OSE_PROD_DRUSERNAME
      - OSE_PROD_DRPASSWORD
      - OSE_PERF_HOST_URL
