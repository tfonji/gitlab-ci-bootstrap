# Every CI/CD template gitlab-ci-bootstrap can offer, picked by a human via
# the pipeline's TEMPLATE_NAME dropdown (kept in sync manually with
# .gitlab-ci.yml's `options:` list). Each template's `files` list is the
# whole bundle it adds -- e.g. a Maven template carries both .gitlab-ci.yml
# and .m2/settings.xml; picking the template adds all of them in one
# commit/MR, there's no separate per-file choice.
#
# Each file's `source_path` is fetched from `remote_source` below UNLESS the
# file sets `source: local`, in which case it's read from THIS repo instead
# (see files/) -- for bundle files this tool owns, like settings.xml with
# Nexus/Artifactory credentials, that have no reason to live in the shared
# templates project. The main .gitlab-ci.yml for every template is remote;
# its source_path already matches that project's file naming 1:1 (its
# `templates/` folder).
#
# `detect`/`detect_content_contains` are informational only, consumed by the
# `suggest` command to hint at a likely pick -- they never decide what
# `plan`/`apply` do. Ported from the batch reconciler's old auto-detection
# as a starting point; only the build-tool/language tier is reliably
# detectable (10 of 29 templates), the rest are override-free here too since
# there's no override concept anymore -- a human always makes the final
# call via the dropdown.

remote_source:
  project_path: "dso-templates/ci-cd-components/pipeline-templates"
  ref: master

templates:
  # --- Java: Maven ---
  - name: java-maven-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ci.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
    detect: ["pom.xml"]
  - name: java-maven-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ansible-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
  - name: java-maven-ecs-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-ecs-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
  - name: java-maven-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-openshift-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local
  - name: java-maven-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-maven-openshift-helm-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local

  # --- Java: Gradle ---
  - name: java-gradle-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-ci.gitlab.yml
    detect: ["build.gradle", "build.gradle.kts"]
  - name: java-gradle-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-openshift-ci-cd.gitlab.yml
  - name: java-gradle-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-gradle-openshift-helm-ci-cd.gitlab.yml

  # --- Java: Ant / Tomcat ---
  - name: java-ant-tomcat-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-ant-tomcat-ci-cd.gitlab.yml
        extra_variables:
        - name: GITLAB_PUBLISH
          value: ""
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: .bumpversion.cfg
        source_path: files/bumpversion-ant-tomcat.cfg
        source: local
    detect: ["build.xml"]
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_MAVEN_DEV_REPO
      - ARTIFACTORY_MAVEN_PROD_REPO
      per_project:
      - PROPERTY_FILE
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
      notes:
      - "`PROPERTY_FILE` should point at this app's properties file containing `name=`/`version=` (read by `antPreRelease()`); its `name=` value becomes `artifactId` everywhere downstream (package naming, WAR lookup, deploy) -- the same role `<ApplicationName>` plays for the .NET IIS templates."
      - "The `.bumpversion.cfg`'s `[bumpversion:file:app.properties]` section assumes the properties file is at `app.properties` in the repo root -- if `PROPERTY_FILE` points elsewhere, update this section's file path to match, or `bump:version` will silently bump the wrong file (or none)."
      - "`SERVICE_NAME`, `DEPLOY_DIR`, and `BACKUP_ROOT` already have defaults in the shared template (`Tomcat9`, `D:\\apache-tomcat\\apache-tomcat-current\\webapps`, `D:\\DEV`) as pipeline-run variables, not CI/CD Settings variables -- if this project needs different values, add a `variables:` block directly to this generated `.gitlab-ci.yml` to override them, rather than setting them in Settings > CI/CD > Variables."
      - "`GITLAB_PUBLISH` is set to blank (`\"\"`) in the generated `.gitlab-ci.yml`, overriding the shared template's `'true'` default -- this makes packages publish to Artifactory (`ARTIFACTORY_MAVEN_DEV_REPO`/`ARTIFACTORY_MAVEN_PROD_REPO`) instead of GitLab's own generic package registry."
      - "`DEPLOY_VARIABLE` and `CREATE_RELEASE` are re-declared in the generated `.gitlab-ci.yml` with the full, correct list of deployment tiers (the shared template's own hint text only lists `testing | staging | production`, missing `staging-dr`/`performance`/`production-dr`) -- these are \"Run pipeline\"-prompted variables, not CI/CD Settings variables, so there's nothing to configure in Settings for them."

  # --- Java: Lambda ---
  - name: java-lambda-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/java-lambda-ci-cd.gitlab.yml
      - target_path: .m2/settings.xml
        source_path: files/maven-settings.xml
        source: local

  # --- Node ---
  - name: node-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-ci.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
    detect: ["package.json"]
  - name: node-ecs-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-ecs-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
  - name: node-lambda-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-lambda-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
  - name: node-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-openshift-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local
  - name: node-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/node-openshift-helm-ci-cd.gitlab.yml
      - target_path: .npmrc
        source_path: files/npmrc
        source: local

  # --- Python ---
  - name: python-ci
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/python-ci.gitlab.yml
      - target_path: pip.conf
        source_path: files/pip.conf
        source: local
    detect: ["requirements.txt", "setup.py", "pyproject.toml"]
  - name: python-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/python-ansible-ci-cd.gitlab.yml
      - target_path: pip.conf
        source_path: files/pip.conf
        source: local
  - name: python-lambda-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/python-lambda-ci-cd.gitlab.yml
      - target_path: pip.conf
        source_path: files/pip.conf
        source: local
  - name: python-openshift-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/python-openshift-ci-cd.gitlab.yml
      - target_path: pip.conf
        source_path: files/pip.conf
        source: local

  # --- .NET (IIS is the default target; core vs framework by .csproj content) ---
  - name: dotnet-core-iis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-core-iis-ci-cd.gitlab.yml
        extra_variables:
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
    detect: ["*.csproj"]
    detect_content_contains: "Sdk="
    # No .bumpversion.cfg here -- this template's bumpVersion() does a raw
    # sed on the .csproj's <version> tag directly, no bumpversion tool.
    # The .csproj still needs a custom <ApplicationName> tag (same as
    # dotnet-framework-iis-ci-cd) plus a lowercase <version> tag (NOT
    # <Version> like the Framework template uses).
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_NUGET_DEV_REPO
      - ARTIFACTORY_NUGET_PROD_REPO
      - CONTAINER_FACTORY_IMAGE_TAGS
      per_project:
      - BUILD_TARGET
      - WEB_PROJECT
      - BuildConfiguration
      - BuildPlatform
      - ARTIFACT_STAGING
      - ARTIFACT_NAME
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - IIS_SITE
        - IIS_APPPOOL
        - DEPLOY_PATH
        - BACKUP_ROOT
      notes:
      - "`ARTIFACT_NAME` must exactly match the `<ApplicationName>` tag in the .csproj -- `package:download` names the file after `<ApplicationName>`, and the IIS deploy jobs look for `ARTIFACT_NAME` when finding it locally. A mismatch means deploy can't find the artifact."
      - "`CONTAINER_FACTORY_IMAGE_TAGS` is referenced by `dotnetPreRelease()`'s image-tag lookup but never defined anywhere in this template -- confirm it actually exists at group level rather than assuming, since (unlike the Artifactory variables) it isn't something we've seen defined elsewhere."
      - "The shared template gives `staging` and `staging-dr` the identical GitLab environment name (`Staging`), so as written they can't actually be scoped to different values via GitLab's per-variable Environment scope; `production`/`production-dr` also use inconsistent casing (`production` vs `Production`), an unintentional typo rather than a deliberate distinction. Worth a fix in the shared `dso-templates/ci-cd-components/pipeline-templates` project rather than working around it here."
      - "`DEPLOY_VARIABLE` and `CREATE_RELEASE` are re-declared in the generated `.gitlab-ci.yml` with the complete, correct list of deployment tiers this template's deploy jobs actually use -- these are \"Run pipeline\"-prompted variables, not CI/CD Settings variables, so there's nothing to configure in Settings for them."
  - name: dotnet-framework-iis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-framework-iis-ci-cd.gitlab.yml
        extra_variables:
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
      - target_path: .bumpversion.cfg
        source_path: files/bumpversion.cfg
        source: local
    detect: ["*.csproj"]
    detect_content_contains: "<TargetFrameworkVersion>"
    mr_checklist:
      group_level:
      - ARTIFACTORY_USER
      - ARTIFACTORY_PASSWORD
      - ARTIFACTORY_NUGET_DEV_REPO
      - ARTIFACTORY_NUGET_PROD_REPO
      per_project:
      - SolutionName
      - BuildConfiguration
      - BuildPlatform
      - ARTIFACT_PUBLISH_PATH
      - GITLAB_PUBLISH
      - IS_MSDEPLOY
      per_environment:
        environments: [development, testing, staging, staging-dr, performance, production, production-dr]
        variables:
        - TARGET_HOST
        - WINRM_USER
        - WINRM_PASSWORD
        - IIS_SITE
        - IIS_APPPOOL
        - DEPLOY_PATH
        - PACKAGE_FOLDER
        - BACKUP_ROOT
      notes:
      - "Fill in the `<path to .csproj file>` placeholder in `.bumpversion.cfg` with this app's real .csproj path before merging, or `pre:config`/`bump:version` will fail."
      - "The shared template gives `staging` and `staging-dr` the identical GitLab environment name (`Staging`), so as written they can't actually be scoped to different values via GitLab's per-variable Environment scope; `production`/`production-dr` also use inconsistent casing (`production` vs `Production`), an unintentional typo rather than a deliberate distinction. Worth a fix in the shared `dso-templates/ci-cd-components/pipeline-templates` project rather than working around it here."
      - "`DEPLOY_VARIABLE` and `CREATE_RELEASE` are re-declared in the generated `.gitlab-ci.yml` with the complete, correct list of deployment tiers this template's deploy jobs actually use -- these are \"Run pipeline\"-prompted variables, not CI/CD Settings variables, so there's nothing to configure in Settings for them."
  - name: dotnet-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-ansible-ci-cd.gitlab.yml
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
  - name: dotnet-core-ansible-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-core-ansible-ci-cd.gitlab.yml
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local
  - name: dotnet-core-openshift-helm-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/dotnet-core-openshift-helm-ci-cd.gitlab.yml
      - target_path: nuget.config
        source_path: files/nuget.config
        source: local

  # --- SSIS ---
  - name: ssis-ci-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/ssis-ci-cd.gitlab.yml
        extra_variables:
        - name: DEVENV_PATH
          value: ""
        - name: DEPLOY_VARIABLE
          value: development
          description: "Build/Deployment environment for a manual run (development | testing | staging | staging-dr | performance | production | production-dr)"
          options:
          - development
          - testing
          - staging
          - staging-dr
          - performance
          - production
          - production-dr
        - name: CREATE_RELEASE
          value: "No"
          description: "Create a release (tag) -- only takes effect on the master/hotfix branch (Yes | No)"
          options:
          - "Yes"
          - "No"
    detect: ["*.dtproj"]
    mr_checklist:
      group_level:
      - ARTIFACTORY_TOKEN
      - DEV_ARTIFACTORY_REPOSITORY
      - PROD_ARTIFACTORY_REPOSITORY
      per_project:
      - DEV_TARGET_HOST
      - DEV_WINRM_USER
      - DEV_WINRM_PASSWORD
      - DEV_SSIS_FOLDER_NAME
      - QA_TARGET_HOST
      - QA_WINRM_USER
      - QA_WINRM_PASSWORD
      - QA_SSIS_FOLDER_NAME
      - UAT_TARGET_HOST
      - UAT_WINRM_USER
      - UAT_WINRM_PASSWORD
      - UAT_SSIS_FOLDER_NAME
      - STAGEDR_TARGET_HOST
      - STAGEDR_WINRM_USER
      - STAGEDR_WINRM_PASSWORD
      - STAGEDR_SSIS_FOLDER_NAME
      - PERF_TARGET_HOST
      - PERF_WINRM_USER
      - PERF_WINRM_PASSWORD
      - PERF_SSIS_FOLDER_NAME
      - PROD_TARGET_HOST
      - PROD_WINRM_USER
      - PROD_WINRM_PASSWORD
      - PROD_SSIS_FOLDER_NAME
      - PRODDR_TARGET_HOST
      - PRODDR_WINRM_USER
      - PRODDR_WINRM_PASSWORD
      - PRODDR_SSIS_FOLDER_NAME
      notes:
      - "`version.txt` must exist at the repo root in the format `version: X.Y.Z` -- read by `ssisPreConfigArtifacts()`/`bumpVersion()`. There's no `.bumpversion.cfg` or `bumpversion` CLI for this template; version bumping is done natively in PowerShell."
      - "This template authenticates to Artifactory with a Bearer token (`ARTIFACTORY_TOKEN`) rather than the `ARTIFACTORY_USER`/`ARTIFACTORY_PASSWORD` basic-auth pattern the other templates use."
      - "`UAT_*` variables back the `staging` deployment tier (`ssis:deploy:staging`) -- this project's naming convention for that environment, not a mismatch."
      - "`DEVENV_PATH` is set to blank (`\"\"`) in the generated `.gitlab-ci.yml`, overriding the shared template's hardcoded Visual Studio path default -- set it to this project's actual `devenv.com` path on the Windows runner it builds on."
      - "`DEPLOY_VARIABLE` and `CREATE_RELEASE` are re-declared in the generated `.gitlab-ci.yml` with a corrected tier list -- the shared template's own hint text lists a `staging-pp` value that no deploy job actually checks for (the real job is `ssis:deploy:performance`, checking `\"performance\"`), so anyone typing `staging-pp` per the original hint would trigger no deployment at all."

  # --- Infra-only ---
  - name: terraform-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/terraform-cd.gitlab.yml
    detect: ["*.tf"]
  - name: terraform-cli-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/terraform-cli-cd.gitlab.yml
  - name: terraform-kafka-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/terraform-kafka-cd.gitlab.yml
  - name: ansible-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/ansible-cd.gitlab.yml
    detect: ["ansible.cfg", "playbook.yml", "site.yml"]
  # CAUTION: unlike the other bundles, a project this detect rule matches
  # already HAS a flyway.conf with real per-app DB settings -- applying
  # this template replaces it with the generic files/flyway.conf
  # placeholder. Check the plan output's action for flyway.conf (update vs
  # create) before approving apply.
  - name: flyway-cd
    files:
      - target_path: .gitlab-ci.yml
        source_path: templates/flyway-cd.gitlab.yml
      - target_path: flyway.conf
        source_path: files/flyway.conf
        source: local
    detect: ["flyway.conf"]
